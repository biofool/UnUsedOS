# Unresolved Unknowns
# Each entry: what is unknown, why it matters, cheapest verification.

- id: UNK-001
  unknown: Why main is documentation-only while origin/Public holds the implementation.
  matters: >-
    Determines whether an agent should edit main docs only, check out
    origin/Public, or propose a merge. Misjudging causes wasted work or
    divergence.
  cheapest_verification: >-
    Ask the maintainer; or inspect commit history/dates on both branches for a
    merge/abandon signal (git log --all --graph --oneline).

- id: UNK-002
