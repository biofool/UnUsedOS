# Evidence: DECLARED in README/TechnicalMarketingReadMe; INFERRED from origin/Public.

- id: DEBT-001
  title: main branch is documentation-only; described implementation lives on origin/Public
  category: organizational
  status: open
  affected_paths: [README.md, TechnicalMarketingReadMe.md]
  evidence:
    - "git ls-files on main -> 2 files (README.md, TechnicalMarketingReadMe.md)"
    - "git ls-tree -r origin/Public -> 282 files"
    - "README.md Project Structure section describes absent files"
  cause: UNKNOWN
  risk: >-
    Agents and contributors editing main cannot find the described code. Risk
    of divergent documentation, duplicate work, or accidental creation of a
    second implementation. Blast radius: entire repository orientation.
  priority:
    impact: 4
    likelihood: 5
    reach: 5
    score: 100
    rationale: "Near-certain to confuse any new contributor; affects all work."
  smallest_safe_fix: >-
    Document the branch split explicitly in README (e.g. 'Implementation is on
    the Public branch') or merge origin/Public into main.
  remediation_notes: >-
    Decide intent (merge vs split). If split, add a pointer in README. If merge,
    merge origin/Public into main with review. Validate README accuracy after.
  estimated_effort: S (note uncertainty: merge review could be M)
  agent_suitability: true
  human_review_required: true

- id: DEBT-002
  title: Commented-out credential/privilege-escalation block in security patch scripts
  category: security
  status: open
  affected_paths: [CreateSecurityPatch/CreateSecurityPatchBundle.sh]
  evidence:
    - "origin/Public:CreateSecurityPatch/CreateSecurityPatchBundle.sh contains commented block: adduser fc, chpasswd fc:fcllc00, NOPASSWD sudo via sed on /etc/sudoers"
  cause: UNKNOWN (leftover from setup automation?)
  risk: >-
    If uncommented, creates a passwordless-sudo user with a known password,
    granting root on any host running the script. Blast radius: any host where
    the bundle script runs.
  priority:
    impact: 5
    likelihood: 2
    reach: 4
    score: 40
    rationale: "Severe if enabled; currently commented so likelihood is lower."
  smallest_safe_fix: "Delete the commented credential block entirely."
  remediation_notes: "Remove the block; if setup automation is needed, externalize to a reviewed, secret-managed process."
  estimated_effort: XS
  agent_suitability: true
  human_review_required: true

- id: DEBT-003
  title: Predictable temp file path in patch scripts (symlink race)
  category: security
  status: open
  affected_paths: [CreateSecurityPatch/CreateSecurityPatchBundle.sh, CreateSecurityPatch/SecurityPatchInstaller.sh]
  evidence:
    - "Both scripts use /var/tmp/$$.patchlist"
  cause: Use of PID-based temp filename without O_NOFOLLOW/mktemp.
  risk: >-
    A local attacker could symlink /var/tmp/$$.patchlist to a privileged
    location, causing dpkg to read attacker-controlled content. Blast radius:
    the patch-generator host (requires local non-root user).
  priority:
    impact: 4
    likelihood: 2
    reach: 3
    score: 24
    rationale: "Requires local access; mitigated by single-user patch generator."
  smallest_safe_fix: "Use mktemp instead of /var/tmp/$$.patchlist."
  remediation_notes: "Replace with $(mktemp); ensure cleanup in a trap."
  estimated_effort: XS
  agent_suitability: true
  human_review_required: false

